<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fleet maintenance hours</title>
<script>try{var _t=localStorage.getItem("theme");if(_t!=="light"&&_t!=="dark")_t=window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";document.documentElement.setAttribute("data-theme",_t);}catch(e){}</script>
<style>
:root{--bg:#f7f6f3;--card:#fff;--text:#1f1f1d;--muted:#6b6a66;--line:#e2e0da;--red:#d93a3a;--redbg:#fcebeb;--redtx:#8f1f1f;--amb:#e59a1b;--ambbg:#faeeda;--ambtx:#6b4306;--grn:#3f9a4a;--grnbg:#eaf3de;--grntx:#27500a;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1a18;--card:#262624;--text:#f1efe8;--muted:#a3a29b;--line:#3a3a37;--redbg:#4a1b1b;--redtx:#f7c1c1;--ambbg:#4a3410;--ambtx:#fac775;--grnbg:#1f3a15;--grntx:#c0dd97}}
:root[data-theme="dark"]{--bg:#1a1a18;--card:#262624;--text:#f1efe8;--muted:#a3a29b;--line:#3a3a37;--redbg:#4a1b1b;--redtx:#f7c1c1;--ambbg:#4a3410;--ambtx:#fac775;--grnbg:#1f3a15;--grntx:#c0dd97;color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.layout{max-width:1040px;margin:0 auto;display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px;align-items:start}
.layout>main{grid-column:2;grid-row:1;min-width:0}
.notes{grid-column:1;grid-row:1;position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto;padding:2px 16px 0 0;border-right:0.5px solid var(--line);font-size:13px;color:var(--muted)}
.notes h2{font-size:12px;font-weight:500;color:var(--muted);margin:0 0 6px;text-transform:uppercase;letter-spacing:.05em}
.notes label{display:block;font-size:11px;color:var(--muted);margin:6px 0 2px}
.notes input,.notes textarea{width:100%;font:inherit;font-size:13px;color:var(--text);background:transparent;border:0.5px solid var(--line);border-radius:6px;padding:6px 8px}
.notes textarea{resize:vertical;min-height:56px}
.notes input:focus-visible,.notes textarea:focus-visible{outline:1px solid var(--muted);outline-offset:1px}
#nSave{font:inherit;font-size:13px;color:var(--muted);background:none;border:0.5px solid var(--line);border-radius:6px;padding:5px 12px;min-height:32px;cursor:pointer;margin-top:8px}
#nSave:hover{color:var(--text)}
#nSave:disabled{opacity:.5;cursor:default}
.notes .banner{background:none;color:var(--amb);padding:0;margin:0 0 6px;font-size:11px}
#nList{margin-top:10px}
.nitem{padding:7px 0;border-top:0.5px solid var(--line)}
.nitem .who{font-size:12px;font-weight:500;color:var(--muted)}
.nitem .txt{font-size:13px;color:var(--text);opacity:.85;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:1px}
.bh{font-size:12px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:22px 0 8px}
#view .bh:first-child{margin-top:0}
@media (max-width:859px){
.layout{grid-template-columns:1fr}
.layout>main,.notes{grid-column:1}
.notes{grid-row:2;position:static;max-height:none;border-right:0;border-top:0.5px solid var(--line);padding:14px 0 0}
.notes input,.notes textarea{font-size:16px}
}
@media (max-width:600px){
.bar{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.grp-r{margin-left:0}
.grp-r .seg{justify-content:flex-start}
.grp-r .lbl{flex-direction:row}
.seg button{flex:1 1 auto;padding:8px 10px;font-size:13px}
#bases{display:grid;grid-template-columns:1fr 1fr}
#bases button:first-child{grid-column:1/-1}
}
h1{font-size:20px;font-weight:500;margin:0}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.sub{font-size:13px;color:var(--muted)}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 0}
.seg button{font:inherit;font-size:14px;color:var(--text);background:var(--card);border:0.5px solid var(--line);border-radius:8px;padding:8px 12px;min-height:40px;cursor:pointer}
.seg button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.bar{display:flex;justify-content:space-between;align-items:flex-start;gap:8px 16px;flex-wrap:wrap;margin:12px 0 0}
.bar .seg{margin:0}
.grp{min-width:0}
.grp-r{margin-left:auto}
.grp-r .seg{justify-content:flex-end}
.lbl{display:flex;align-items:center;gap:8px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);opacity:.7;margin:0 0 5px}
.lbl::after{content:"";flex:1;height:0;border-top:0.5px solid var(--line)}
.grp-r .lbl{flex-direction:row-reverse}
.banner{margin:12px 0 0;padding:10px 12px;border-radius:8px;font-size:14px}
.red{background:var(--redbg);color:var(--redtx)}.amb{background:var(--ambbg);color:var(--ambtx)}.grn{background:var(--grnbg);color:var(--grntx)}
#view{margin-top:16px}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;margin-bottom:6px;background:var(--card);border:0.5px solid var(--line);border-radius:8px}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.d-red{background:var(--red)}.d-amb{background:var(--amb)}.d-grn{background:var(--grn)}
.tail{font-weight:500}.grow{flex:1}
.big{font-size:20px;font-weight:500;min-width:72px;text-align:right}
.small{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:var(--card);border:0.5px solid var(--line);border-radius:12px;padding:12px}
.num{font-size:24px;font-weight:500;margin:2px 0 8px}
button.row,button.cardbtn{width:100%;font:inherit;color:inherit;text-align:left;cursor:pointer}
.row.open{margin-bottom:4px}
.big{white-space:nowrap}
.panel{background:var(--bg);border:0.5px solid var(--line);border-left:3px solid var(--muted);border-radius:8px;padding:4px 12px 8px;margin:0 20px 16px 28px}
.card .panel{background:none;border:0;border-top:0.5px solid var(--line);border-radius:0;padding:4px 0 0;margin:10px 0 0}
.card.wide{grid-column:1/-1}
.status{margin:10px 0 0;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.status .dot{width:8px;height:8px}
.banner.strong{font-size:15px;padding:12px 14px;border-left:4px solid}
.banner.amb.strong{border-left-color:var(--amb)}
.banner.red.strong{border-left-color:var(--red)}
.stale .pill.est{outline:1.5px dashed currentColor;outline-offset:-3px;opacity:.8}
.lnk{font:inherit;font-size:12px;color:var(--muted);background:none;border:0.5px solid var(--line);border-radius:6px;padding:3px 10px;min-height:28px;cursor:pointer;margin:6px 6px 0 0}
.lnk:hover{color:var(--text)}
.lnk.strong{color:var(--bg);background:var(--text);border-color:var(--text)}
.lnk:disabled{opacity:.5;cursor:default}
.cf{margin-top:6px;padding:8px;border:0.5px solid var(--line);border-radius:8px;background:var(--card)}
.cf input{font:inherit;font-size:16px;color:var(--text);background:transparent;border:0.5px solid var(--line);border-radius:6px;padding:5px 8px;width:100%;margin-bottom:6px}
.cfrow{display:flex;gap:6px}.cfrow input{min-width:0}
.cfmsg{color:var(--red);margin-top:4px}
.chk.isdone .nm{text-decoration:line-through;opacity:.6}
.pill{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:88px;padding:5px 10px;border-radius:8px;line-height:1.15;white-space:nowrap;flex:none}
.pill .pn{font-size:20px;font-weight:500}
.pill .pl{font-size:11px;opacity:.85}
.p-red{background:var(--redbg);color:var(--redtx)}
.p-amb{background:var(--ambbg);color:var(--ambtx)}
.p-grn{background:var(--grnbg);color:var(--grntx)}
.d-none{background:var(--muted)}
.cardbtn .dot{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:baseline}
.card.l-red{background:var(--redbg);border-color:var(--red);color:var(--redtx)}
.card.l-amb{background:var(--ambbg);border-color:var(--amb);color:var(--ambtx)}
.card.l-grn{background:var(--grnbg);border-color:var(--grn);color:var(--grntx)}
.card[class*="l-"] .cardbtn .small{color:inherit;opacity:.85}
.card[class*="l-"] .panel{color:var(--text);border-top-color:var(--line)}
button.cardbtn{background:none;border:0;padding:0;display:block}
.chk{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-top:0.5px solid var(--line)}
.chk:first-of-type{border-top:0}
.chk .dot{margin-top:6px;width:10px;height:10px}
.chk .val{font-weight:500;white-space:nowrap;text-align:right}
.chk .nm{font-size:14px}
.note{font-size:12px;color:var(--amb)}
.meta{font-size:12px;color:var(--muted);padding:6px 0 2px}
.acft{margin-bottom:14px}.acft h2{font-size:16px;font-weight:500;margin:0 0 2px}
.themebtn{font:inherit;font-size:13px;color:var(--text);background:var(--card);border:0.5px solid var(--line);border-radius:8px;padding:6px 12px;min-height:36px;cursor:pointer}
a.photo{display:inline-block;font-size:14px;color:var(--text);background:var(--card);border:0.5px solid var(--line);border-radius:8px;padding:8px 14px;min-height:40px;line-height:24px;text-decoration:none}
button:focus-visible,a.photo:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.foot{margin-top:16px}
</style>
</head>
<body>
<div class="layout">
<main>
  <div class="top"><h1 id="title">Fleet maintenance hours</h1><div class="sub" style="display:flex;align-items:center;gap:10px"><span id="updated"></span><button id="theme" class="themebtn" aria-label="Colour theme"></button></div></div>
  <div id="banners"></div>
  <div class="bar">
    <div class="grp"><div class="lbl">View</div><div class="seg" id="views" aria-label="View"></div></div>
    <div class="grp grp-r"><div class="lbl">Base</div><div class="seg" id="bases" aria-label="Base"></div></div>
  </div>
  <div id="view"></div>
  <p class="small foot" id="foot"></p>
  <details class="foot">
    <summary class="small" style="cursor:pointer">Update history</summary>
    <div id="histlist" class="small" style="max-height:240px;overflow:auto;margin-top:6px"></div>
  </details>
</main>
<aside class="notes" aria-label="Notes">
  <h2>Notes</h2>
  <div id="nBanner"></div>
  <label for="nName">Your name</label>
  <input id="nName" maxlength="60" autocomplete="name">
  <label for="nText">Note</label>
  <textarea id="nText" maxlength="1000" placeholder="e.g. ZK-IBV hours don’t match the tech log sheet"></textarea>
  <button id="nSave" type="button">Add note</button>
  <div class="small" id="nMsg" style="margin-top:6px"></div>
  <div id="nList"></div>
</aside>
</div>
<script>
var ALL="__all";
var UPDATE_HOUR_NZ=6; // the hour (NZ time) the nightly update normally finishes. Used in the "not updated yet" message.
function nzHour(){return parseInt(new Date().toLocaleString("en-GB",{timeZone:"Pacific/Auckland",hour:"2-digit",hour12:false}),10)%24;}
function hourText(h){return (h%12||12)+(h<12?" am":" pm");}
var VIEWS=[["list","List"],["cards","Cards"],["detail","All checks"]];
var state={hours:null,air:null,demo:false,base:null,view:"list",open:{},done:{},confirm:null};

function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function f(v){return v.toFixed(1);}
function ckey(tail,c){return tail+"|"+c.name+"|"+(isNum(c.hours)?c.hours:"")+"|"+(c.date||"");}
function isNum(v){return typeof v==="number"&&isFinite(v);}
function todayNZ(){return new Date().toLocaleDateString("en-CA",{timeZone:"Pacific/Auckland"});}
function daysUntil(iso){return Math.round((Date.parse(iso+"T00:00:00Z")-Date.parse(todayNZ()+"T00:00:00Z"))/864e5);}
function fmtDate(iso){return new Date(iso+"T00:00:00Z").toLocaleDateString("en-NZ",{timeZone:"UTC",day:"numeric",month:"short",year:"numeric"});}
function fmtH(v){return v<0?f(-v)+" hrs over":f(v)+" hrs";}
function fmtD(d){return d<0?(-d)+(d===-1?" day over":" days over"):d===0?"Today":d+(d===1?" day":" days");}

function themeNow(){
  var t=store("theme");if(t==="light"||t==="dark")return t;
  return window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";
}
function applyTheme(){
  var t=themeNow();
  document.documentElement.setAttribute("data-theme",t);
  document.getElementById("theme").textContent="Theme: "+(t==="dark"?"Dark":"Light");
}
function sample(){
  var bases=["Queenstown","Mt Cook","Fox","Franz Josef"],L="ABCDEFGHIJKLMNOPQRSTUVWX",s=7;
  var r=function(){s=(s*9301+49297)%233280;return s/233280;};
  var hours={},air={};
  function iso(n){var d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}
  for(var i=0;i<24;i++){
    var t="ZK-HA"+L[i],h=Math.round((1000+r()*3000)*10)/10;hours[t]=h;
    air[t]={base:bases[Math.floor(i/6)],checks:[
      {name:"50 hr inspection",hours:Math.round((h+r()*50)*10)/10},
      {name:"100 hr inspection",hours:Math.round((h+r()*100)*10)/10},
      {name:"Review of airworthiness",date:iso(Math.floor(r()*120))}]};
  }
  return {hours:{updated:new Date().toISOString(),aircraft:hours},air:{thresholds:{red:5,amber:20,redDays:7,amberDays:30,hoursPerDay:1},aircraft:air}};
}

function load(){
  var t="?t="+Date.now();
  return Promise.all([fetch("hours.json"+t).then(function(r){if(!r.ok)throw 0;return r.json();}),fetch("aircraft.json"+t).then(function(r){if(!r.ok)throw 0;return r.json();})])
  .then(function(x){state.hours=x[0];state.air=x[1];state.demo=false;})
  .catch(function(){var d=sample();state.hours=d.hours;state.air=d.air;state.demo=true;})
  .then(render);
}

// One check: hours remaining and/or days remaining. Colour uses the red/amber limits.
// Sort order uses "estimated days until due": hours are converted to days at the aircraft's flying rate (hrs/day).
function rank(l){return l==="red"?0:l==="amb"?1:l==="done"?3:2;}
function scoreCheck(c,h,T,rate){
  var hr=isNum(c.hours)&&isNum(h)?c.hours-h:null;
  var dy=typeof c.date==="string"&&c.date?daysUntil(c.date):null;
  var eh=hr===null?null:hr/rate;
  var score=eh===null?dy:dy===null?eh:Math.min(eh,dy);
  var lh=hr===null?"grn":hr<=T.red?"red":hr<=T.amber?"amb":"grn";
  var ld=dy===null?"grn":dy<=T.redDays?"red":dy<=T.amberDays?"amb":"grn";
  var lvl=rank(lh)<=rank(ld)?lh:ld;
  // Show whichever of hours/days is driving the colour; if equal, whichever is due sooner
  var byHours=false;
  if(eh!==null){
    if(dy===null)byHours=true;
    else if(rank(lh)!==rank(ld))byHours=rank(lh)<rank(ld);
    else byHours=eh<=dy;
  }
  return {c:c,hr:hr,dy:dy,score:score,lvl:lvl,byHours:byHours};
}
// Most urgent first: red, then amber, then green; within a colour, soonest likely due date first
function byUrgency(x,y){
  var d=rank(x.lvl)-rank(y.lvl);
  if(d)return d;
  return (x.score===null?1e9:x.score)-(y.score===null?1e9:y.score);
}
function mainText(k){
  if(k.score===null)return isNum(k.c.hours)?"No hours":"–";
  return k.byHours?fmtH(k.hr):fmtD(k.dy);
}
function otherText(k){
  if(k.hr!==null&&k.dy!==null)return k.byHours?fmtD(k.dy):fmtH(k.hr);
  return "";
}

function listPill(k){
  var num,lab;
  if(k.byHours){
    if(k.hr<0){num=f(-k.hr);lab="hours over";}else{num=f(k.hr);lab="hours to run";}
  }else if(k.dy<0){num=String(-k.dy);lab=k.dy===-1?"day over":"days over";
  }else if(k.dy===0){num="Today";lab="due";
  }else{num=String(k.dy);lab=k.dy===1?"day to run":"days to run";}
  return '<span class="pill p-'+k.lvl+(k.byHours?' est':'')+'"><span class="pn">'+esc(num)+'</span><span class="pl">'+lab+'</span></span>';
}

function compute(base){
  var T=Object.assign({red:5,amber:20,redDays:7,amberDays:30,hoursPerDay:1},state.air.thresholds||{}),out=[];
  Object.keys(state.air.aircraft).forEach(function(tail){
    var a=state.air.aircraft[tail];if(a.base!==base)return;
    var h=state.hours.aircraft[tail];
    var rate=a.hoursPerDay>0?a.hoursPerDay:T.hoursPerDay;
    var ks=(a.checks||[]).map(function(c){
      var key=ckey(tail,c),dn=state.done[key]||null,k;
      if(dn&&(isNum(dn.newHours)||dn.newDate)){
        // completed, and the new due times were entered: track the new cycle
        var c2=Object.assign({},c,{hours:isNum(dn.newHours)?dn.newHours:undefined,date:dn.newDate||undefined,from:undefined,note:undefined});
        k=scoreCheck(c2,h,T,rate);
      }else if(dn){
        k={c:c,hr:null,dy:null,score:null,lvl:"done",byHours:false};
      }else k=scoreCheck(c,h,T,rate);
      k.key=key;k.done=dn;return k;
    });
    ks.sort(byUrgency);
    var next=ks.length&&ks[0].score!==null?ks[0]:null;
    out.push({tail:tail,a:a,h:h,checks:ks,next:next});
  });
  out.sort(function(a,b){
    if(!a.next||!b.next)return (a.next?0:1)-(b.next?0:1);
    return byUrgency(a.next,b.next);
  });
  return {list:out,T:T};
}

function th(a){return isNum(a.h)?' <span class="small" style="font-weight:400">('+f(a.h)+')</span>':'';}

function confirmForm(key){
  return '<div class="cf"><div class="small" style="margin-bottom:6px">Mark this check as done?</div>'
   +'<input class="cfn" placeholder="Your name" maxlength="60" autocomplete="name" value="'+esc(store("noteName")||"")+'">'
   +'<div class="small" style="margin-bottom:4px">Optional: new due times from the new tech log sheet</div>'
   +'<div class="cfrow"><input class="cfh" inputmode="decimal" placeholder="New due hours"><input class="cfd" type="date" aria-label="New due date"></div>'
   +'<div><button class="lnk strong" data-act="confirm" data-ck="'+esc(key)+'">Confirm done</button><button class="lnk" data-act="cancel">Cancel</button></div>'
   +'<div class="small cfmsg"></div></div>';
}
function checkRows(a){
  if(!a.checks.length)return '<div class="small" style="padding:8px 0">No checks entered yet.</div>';
  return a.checks.map(function(k){
    var c=k.c,sub=[],isDone=k.lvl==="done",dn=k.done,extra="";
    if(isNum(c.from))sub.push("window opens at "+c.from.toFixed(2));
    if(isNum(c.hours))sub.push((isDone?"was due at ":"due at ")+c.hours.toFixed(2)+" hrs");
    if(c.date)sub.push((isDone?"was due ":"due ")+fmtDate(c.date));
    var o=isDone?"":otherText(k);
    if(dn){
      extra='<div class="small">Completed by '+esc(dn.name||"unknown")+' · '+esc(fmtNoteTime(dn.time))+(isNum(dn.hoursAt)?' · aircraft at '+f(dn.hoursAt)+' hrs':'')+(isDone?' · waiting for new due times':' · new due times entered')+'</div><button class="lnk" data-act="undo" data-ck="'+esc(k.key)+'">Undo</button>';
    }else if(state.confirm===k.key){extra=confirmForm(k.key);}
    else{extra='<button class="lnk" data-act="ask" data-ck="'+esc(k.key)+'">Mark done</button>';}
    return '<div class="chk'+(isDone?' isdone':'')+'"><span class="dot d-'+(isDone?'none':k.lvl)+'"></span><span class="grow"><div class="nm">'+esc(c.name)+'</div><div class="small">'+esc(sub.join(" · "))+'</div>'+(c.note?'<div class="note">'+esc(c.note)+'</div>':'')+extra+'</span><span><div class="val">'+esc(isDone?"Done":mainText(k))+'</div>'+(o?'<div class="small" style="text-align:right">'+esc(o)+'</div>':'')+'</span></div>';
  }).join("");
}
function meta(a){
  var p=[];if(a.a.type)p.push(a.a.type);if(a.a.sheet)p.push("tech log sheet "+a.a.sheet);if(a.a.raised)p.push("raised "+fmtDate(a.a.raised));
  return p.length?'<div class="meta">'+esc(p.join(" · "))+'</div>':'';
}
function photoLink(a){
  if(!a.a.photo)return '';
  var d=a.a.photoDate?' <span class="small">(photo from '+esc(fmtDate(a.a.photoDate))+')</span>':'';
  return '<div style="padding:6px 0 4px"><a class="photo" href="'+esc(a.a.photo)+'" target="_blank" rel="noopener">View tech log photo</a>'+d+'</div>';
}
function panel(a){return '<div class="panel">'+meta(a)+photoLink(a)+checkRows(a)+'</div>';}

function vList(d){
  return d.list.map(function(a){
    var open=!!state.open[a.tail],n=a.next;
    var dot=n?'d-'+n.lvl:'" style="background:var(--muted)',
        sub=n?esc(n.c.name):(a.checks.length?'Waiting for new due times':'No checks entered'),
        pill=n?listPill(n):'';
    return '<div><button class="row'+(open?' open':'')+'" data-tail="'+esc(a.tail)+'" aria-expanded="'+open+'"><span class="dot '+dot+'"></span><span class="grow"><span class="tail">'+esc(a.tail)+'</span>'+th(a)+'<div class="small">'+sub+'</div></span>'+pill+'</button>'+(open?panel(a):'')+'</div>';
  }).join("");
}

function vCards(d){
  return '<div class="grid">'+d.list.map(function(a){
    var open=!!state.open[a.tail],n=a.next;
    var lvl=n?n.lvl:"none";
    return '<div class="card l-'+lvl+(open?' wide':'')+'"><button class="cardbtn" data-tail="'+esc(a.tail)+'" aria-expanded="'+open+'"><div class="small"><span class="dot d-'+lvl+'"></span>'+esc(a.tail)+th(a)+'</div><div class="num">'+(n?esc(mainText(n)):'No data')+'</div><div class="small">'+(n?esc(n.c.name):(a.checks.length?'Waiting for new due times':'No checks entered'))+'</div></button>'+(open?panel(a):'')+'</div>';
  }).join("")+'</div>';
}

function vDetail(d){
  return d.list.map(function(a){
    return '<div class="acft"><h2>'+esc(a.tail)+th(a)+'</h2>'+meta(a)+'<div class="card" style="padding:4px 12px">'+checkRows(a)+'</div></div>';
  }).join("");
}

function render(){
  if(!state.hours||!state.air)return;
  var bases=[];
  Object.keys(state.air.aircraft).forEach(function(t){var b=state.air.aircraft[t].base;if(bases.indexOf(b)<0)bases.push(b);});
  if(state.base!==ALL&&bases.indexOf(state.base)<0){var sb=store("base");state.base=(sb===ALL||bases.indexOf(sb)>=0)?sb:bases[0];}
  var sv=store("view");if(sv&&VIEWS.some(function(v){return v[0]===sv;}))state.view=sv;

  document.getElementById("title").textContent=state.base===ALL?"All bases":state.base+" base";
  document.getElementById("bases").innerHTML=[ALL].concat(bases).map(function(b){return '<button data-base="'+esc(b)+'" class="'+(b===state.base?"on":"")+'">'+(b===ALL?"All bases":esc(b))+'</button>';}).join("");
  document.getElementById("views").innerHTML=VIEWS.map(function(v){return '<button data-view="'+v[0]+'" class="'+(v[0]===state.view?"on":"")+'">'+v[1]+'</button>';}).join("");

  var up=new Date(state.hours.updated),age=(Date.now()-up.getTime())/36e5,ban="";
  document.getElementById("updated").textContent="Updated "+up.toLocaleString("en-NZ",{timeZone:"Pacific/Auckland",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
  if(state.demo)ban+='<div class="banner amb">Showing sample data. Couldn’t load the live hours.</div>';
  else{
    var whenFull=up.toLocaleString("en-NZ",{timeZone:"Pacific/Auckland",weekday:"short",day:"numeric",month:"short",hour:"numeric",minute:"2-digit"});
    var behind=-daysUntil(up.toLocaleDateString("en-CA",{timeZone:"Pacific/Auckland"}));
    if(behind>=2){
      ban+='<div class="banner red strong"><b>Out of date.</b> The hours were last updated '+esc(whenFull)+' ('+behind+' days ago). Don’t rely on them. Check Aeronet directly.</div>';
    }else if(behind===1){
      var late=nzHour()>UPDATE_HOUR_NZ;
      ban+='<div class="banner amb strong"><b>Not updated yet today.</b> These are yesterday’s numbers (last updated '+esc(whenFull)+') and don’t include yesterday’s flying, so aircraft may be closer to their checks than shown. '+(late?'Today’s update is late, so check Aeronet directly.':'Today’s update is due around '+hourText(UPDATE_HOUR_NZ)+'.')+'</div>';
    }else{
      ban+='<div class="status"><span class="dot d-grn"></span>Up to date · updated today '+esc(up.toLocaleTimeString("en-NZ",{timeZone:"Pacific/Auckland",hour:"numeric",minute:"2-digit"}))+'</div>';
    }
    state.stale=behind>=1;
  }
  if(state.demo)state.stale=false;
  document.body.classList.toggle("stale",!!state.stale);
  document.getElementById("banners").innerHTML=ban;

  var fn=state.view==="cards"?vCards:state.view==="detail"?vDetail:vList,d,html="";
  if(state.base===ALL){
    bases.forEach(function(b){d=compute(b);html+='<div class="bh">'+esc(b)+'</div>'+fn(d);});
  }else{d=compute(state.base);html=fn(d);}
  document.getElementById("view").innerHTML=html;
  document.getElementById("foot").textContent="Hours or days remaining until each check, whichever comes first. Red: "+d.T.red+" hrs or "+d.T.redDays+" days or less. Amber: "+d.T.amber+" hrs or "+d.T.amberDays+" days or less. Listed red first, then amber, then green, and within each colour in the order they are likely to fall due, assuming "+d.T.hoursPerDay+" flying hrs a day. Confirm against official maintenance records.";
}

document.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  if(b.dataset.act){doAct(b);return;}
  if(b.id==="theme"){var n=themeNow()==="dark"?"light":"dark";store("theme",n);applyTheme();return;}
  if(b.dataset.base){state.base=b.dataset.base;store("base",state.base);render();}
  if(b.dataset.view){state.view=b.dataset.view;store("view",state.view);render();}
  if(b.dataset.tail){state.open[b.dataset.tail]=!state.open[b.dataset.tail];render();}
});
function loadHistory(){
  fetch("history.json?t="+Date.now()).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(h){
    var rows=h.slice().reverse().map(function(e){
      var d=new Date(e.time).toLocaleString("en-NZ",{timeZone:"Pacific/Auckland",weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
      return '<div>'+esc(d)+' · '+e.count+' aircraft</div>';
    }).join("");
    document.getElementById("histlist").innerHTML=rows||"No updates recorded yet.";
  }).catch(function(){document.getElementById("histlist").textContent="No update history yet.";});
}
// ---------- Notes ----------
// Paste your Google Apps Script web app link between the quotes to share notes between everyone.
// While it is empty, notes are saved on this device only.
var NOTES_URL="https://script.google.com/macros/s/AKfycbwttLjWUg0_z3epieCrzbjcfCWXvzmAxXGIVgm7xQsM-vIrbHhITa_Ql31lfKBegYkK/exec";
var notes=[];
function localNotes(){try{return JSON.parse(localStorage.getItem("notes")||"[]");}catch(e){return [];}}
function fmtNoteTime(iso){
  var d=new Date(iso);if(isNaN(d.getTime()))return "";
  return d.toLocaleString("en-NZ",{timeZone:"Pacific/Auckland",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
}
function renderNotes(){
  document.getElementById("nBanner").innerHTML=NOTES_URL?"":'<div class="banner amb">Notes are saved on this device only. Shared notes aren’t set up yet.</div>';
  document.getElementById("nList").innerHTML=notes.length?notes.slice(0,50).map(function(n){
    return '<div class="nitem"><div class="who">'+esc(n.name)+' <span class="small" style="font-weight:400">· '+esc(fmtNoteTime(n.time))+'</span></div><div class="txt">'+esc(n.text)+'</div></div>';
  }).join(""):'<div class="small">No notes yet.</div>';
}
function loadNotes(){
  if(!NOTES_URL){notes=localNotes();renderNotes();return;}
  fetch(NOTES_URL+(NOTES_URL.indexOf("?")<0?"?":"&")+"t="+Date.now())
    .then(function(r){if(!r.ok)throw 0;return r.json();})
    .then(function(n){notes=Array.isArray(n)?n:[];renderNotes();})
    .catch(function(){renderNotes();document.getElementById("nMsg").textContent="Couldn’t load the shared notes.";});
}
function saveNote(){
  var nameEl=document.getElementById("nName"),textEl=document.getElementById("nText"),btn=document.getElementById("nSave"),msg=document.getElementById("nMsg");
  var name=nameEl.value.trim(),text=textEl.value.trim();
  if(!name||!text){msg.textContent="Please add your name and a note.";return;}
  store("noteName",name);
  msg.textContent="";
  if(!NOTES_URL){
    var all=localNotes();all.unshift({time:new Date().toISOString(),name:name,text:text});
    store("notes",JSON.stringify(all.slice(0,200)));
    textEl.value="";loadNotes();return;
  }
  btn.disabled=true;btn.textContent="Saving…";
  fetch(NOTES_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({name:name,text:text})})
    .then(function(r){if(!r.ok)throw 0;return r.json();})
    .then(function(j){if(!j||!j.ok)throw 0;textEl.value="";loadNotes();})
    .catch(function(){msg.textContent="Couldn’t save the note. Please try again.";})
    .then(function(){btn.disabled=false;btn.textContent="Add note";});
}
document.getElementById("nName").value=store("noteName")||"";
document.getElementById("nSave").addEventListener("click",saveNote);

// ---------- Completed checks (shared through the same Google Sheet as the notes) ----------
function ingestDone(list){
  var d={};
  (Array.isArray(list)?list:[]).slice().sort(function(x,y){return String(x&&x.time)<String(y&&y.time)?-1:1;}).forEach(function(r){
    if(!r||typeof r.key!=="string")return;
    if(r.action==="undo"){delete d[r.key];return;}
    if(r.action!=="done")return;
    var nh=parseFloat(r.newHours),ha=parseFloat(r.hoursAt),nd=String(r.newDate||"").slice(0,10);
    d[r.key]={name:String(r.name||""),time:r.time,hoursAt:isNaN(ha)?null:ha,newHours:isNaN(nh)?null:nh,newDate:/^\d{4}-\d{2}-\d{2}$/.test(nd)?nd:null};
  });
  state.done=d;
}
function localDone(){try{return JSON.parse(localStorage.getItem("done")||"[]");}catch(e){return [];}}
function loadDone(){
  if(!NOTES_URL){ingestDone(localDone());render();return Promise.resolve();}
  return fetch(NOTES_URL+(NOTES_URL.indexOf("?")<0?"?":"&")+"what=done&t="+Date.now())
    .then(function(r){if(!r.ok)throw 0;return r.json();})
    .then(function(l){ingestDone(l);render();})
    .catch(function(){});
}
function sendDone(rec){
  if(!NOTES_URL){
    rec.time=new Date().toISOString();
    var all=localDone();all.push(rec);
    try{localStorage.setItem("done",JSON.stringify(all.slice(-500)));}catch(e){}
    return Promise.resolve();
  }
  return fetch(NOTES_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(rec)})
    .then(function(r){if(!r.ok)throw 0;return r.json();})
    .then(function(j){if(!j||!j.ok)throw 0;});
}
function doAct(b){
  var key=b.dataset.ck||"",act=b.dataset.act,parts=key.split("|"),tail=parts[0],hrs=state.hours.aircraft[tail];
  if(act==="ask"){state.confirm=key;render();return;}
  if(act==="cancel"){state.confirm=null;render();return;}
  if(act==="undo"){
    b.disabled=true;
    sendDone({type:"done",action:"undo",key:key,tail:tail,check:parts[1]||"",name:store("noteName")||""})
      .then(loadDone).catch(function(){b.disabled=false;alert("Couldn’t save. Please try again.");});
    return;
  }
  if(act==="confirm"){
    var box=b.closest(".cf"),msg=box.querySelector(".cfmsg");
    var name=box.querySelector(".cfn").value.trim(),raw=box.querySelector(".cfh").value.trim(),nd=box.querySelector(".cfd").value;
    var nh=raw===""?null:parseFloat(raw);
    if(!name){msg.textContent="Please add your name.";return;}
    if(raw!==""&&(isNaN(nh)||(isNum(hrs)&&nh<=hrs))){msg.textContent="New due hours must be higher than the aircraft’s current hours"+(isNum(hrs)?" ("+f(hrs)+").":".");return;}
    if(nd&&daysUntil(nd)<0){msg.textContent="The new due date can’t be in the past.";return;}
    store("noteName",name);
    b.disabled=true;b.textContent="Saving…";
    sendDone({type:"done",action:"done",key:key,tail:tail,check:parts[1]||"",name:name,hoursAt:isNum(hrs)?hrs:"",newHours:nh===null?"":nh,newDate:nd||""})
      .then(function(){state.confirm=null;return loadDone();})
      .catch(function(){b.disabled=false;b.textContent="Confirm done";msg.textContent="Couldn’t save. Please try again.";});
  }
}

applyTheme();load();loadHistory();loadNotes();loadDone();
setInterval(function(){if(!state.confirm){load();loadDone();}},600000);setInterval(loadNotes,300000);
</script>
